name: openclaw-channel-chatwoot

# Single OpenClaw container. Chatwoot is NOT deployed here: inbound events and
# the Chatwoot public API are provided by in-process mocks during tests, and the
# plugin's baseUrl points at the real Chatwoot instance in production.
services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: openclaw-channel-chatwoot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-change-me-in-env}
      OPENCLAW_CHATWOOT_STATE_DIR: /home/node/.openclaw/plugin-state/chatwoot
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    volumes:
      # Persistent OpenClaw state (config, credentials, sessions, plugin state).
      - openclaw-state:/home/node/.openclaw
      # This plugin. Writable so the test runner can install dev deps; the
      # gateway is the only OpenClaw container (CLI/tests run via `run --rm`).
      - ./:/plugin
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:18789/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  openclaw-state:
